# ============================================================
# MCLogin Forge 构建属性
# 目标平台：Minecraft 1.20.1 / Forge 47.x / Java 17
# ============================================================

# Minecraft / Forge 版本
minecraft_version=1.20.1
# D1 修复（DSH 2026-09-27）：原为 47.1.0，偏旧。
# 依据 Forge 官方 promotions_slim.json：1.20.1-recommended = 47.4.10、1.20.1-latest = 47.4.23。
# 取官方 recommended 值。仍属 47.x 线，**基线未变**（仍是 MC 1.20.1 / Forge 47.x / Java 17）。
forge_version=47.4.10
forgegradle_version=6.0.16

# Mojang 官方映射（1.20.1 使用 official 映射）
mapping_channel=official
mapping_version=1.20.1

# 模组元信息
mod_id=mclogin
mod_name=MCLogin
mod_version=1.1.0
mod_group_id=com.dsh.mclogin
mod_authors=DSH
mod_license=MIT

# JVM 内存（构建/运行时）
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
