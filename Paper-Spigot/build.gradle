plugins { id 'java' }
group = 'com.dsh.mclogin'
version = '1.1.0'
base { archivesName = 'mclogin-paper-spigot' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}
dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.17.2'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    testRuntimeOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.register('securityChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dsh.mclogin.security.ResetTicketsTest'
}
tasks.register('compatibilityChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dsh.mclogin.bukkit.CommandPolicyTest'
}
tasks.named('check') { dependsOn 'securityChecks', 'compatibilityChecks' }
